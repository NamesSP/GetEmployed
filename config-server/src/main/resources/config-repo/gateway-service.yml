# =======================================================
# Gateway Service specific configuration (Spring Boot 3.x)
# =======================================================
spring:
  application:
    name: gateway-service

  main:
    web-application-type: reactive

  webflux:
    codec:
      max-in-memory-size: 65536 # Fix for large JWTs/headers

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - PreserveHostHeader=true

          routes:
            # Company Service
            - id: company-service
              uri: http://localhost:8083
              predicates:
                - Path=/companies/**

            # User Service
            - id: user-service
              uri: http://localhost:8090
              predicates:
                - Path=/users/**

            # Job Service
            - id: job-service
              uri: http://localhost:8084
              predicates:
                - Path=/jobs/**

            # Auth Service
            - id: auth-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/auth/**

            # Experience Service
            - id: experience-service
              uri: http://localhost:8086
              predicates:
                - Path=/experiences/**

            # Application Service
            - id: application-service
              uri: http://localhost:8085
              predicates:
                - Path=/applications/**

server:
  port: 8091
  netty:
    max-request-header-size: 65536

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

# JWT Configuration (must match auth-service)
jwt:
  secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
