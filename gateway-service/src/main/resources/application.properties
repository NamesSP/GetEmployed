# =======================================================
# Configuration is now managed by config-server
# Only service-specific overrides go here
# =======================================================

# Config Server Connection (Spring Boot 3.x way)
spring.config.import=configserver:http://localhost:8888
spring.cloud.config.fail-fast=true
spring.profiles.active=default

# Set web application type to reactive for Spring Cloud Gateway
spring.main.web-application-type=reactive

# Eureka Client Configuration
eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.main.allow-bean-definition-overriding=true

# =======================================================
# SERVER CONFIGURATION
# =======================================================
server.port=8091
spring.application.name=gateway-service

# =======================================================
# HTTP CODEC CONFIGURATION (Fix for 431 Header Too Large)
# Increased limit for large JWTs/headers (64KB)
# =======================================================
spring.webflux.codec.max-in-memory-size=65536
server.netty.max-request-header-size=65536

# =======================================================
# SPRING CLOUD GATEWAY CONFIGURATION
# =======================================================
# Default Filters (Applied to ALL routes)
spring.cloud.gateway.server.webflux.default-filters[0]=PreserveHostHeader=true

# -------------------------------------------------------
# ROUTES
# -------------------------------------------------------

# Route 0: Company Service
spring.cloud.gateway.server.webflux.routes[0].id=company-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/companies/**

# Route 1: User Service
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8090
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/users/**

# Route 2: Job Service
spring.cloud.gateway.server.webflux.routes[2].id=job-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/jobs/**

# Route 3: Auth Service
spring.cloud.gateway.server.webflux.routes[3].id=auth-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/auth/**

# Route 4: Experience Service
spring.cloud.gateway.server.webflux.routes[4].id=experience-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8086
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/experiences/**

# Route 5: Application Service
spring.cloud.gateway.server.webflux.routes[5].id=application-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/applications/**
